name: cicd

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: cloning
        run: echo "cloning the code"
  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: echo "code build"
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: tests
        run: echo "code test"
  deploy:
    needs: build,test
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run: echo "code deploy"
