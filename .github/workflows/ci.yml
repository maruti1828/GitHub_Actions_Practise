name: ci

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout/clone code
        uses: actions/checkout@v7
      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: linter install
        uses: pip install ruff
      - name: Run Ruff Linter
        run: ruff check . --output-format=github  
    
